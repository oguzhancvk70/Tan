name: Tan
options:
  bundleIdPrefix: com.oguzhan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: Z69VWX982Z
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Tan:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/Localization
      - path: Resources/MediaRemoteAdapter.dylib
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: "Tan, karanlık/açık mod geçişi için System Events'i, müzik kontrolü için Spotify ve Müzik'i kullanır."
        NSCalendarsFullAccessUsageDescription: "Tan, yaklaşan toplantıları dinamik adada göstermek için takviminizi okur."
        NSBluetoothAlwaysUsageDescription: "Tan, bağlanan kulaklığın pil seviyesini göstermek için Bluetooth kullanır."
    entitlements:
      path: Resources/Tan.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzhan.Tan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
